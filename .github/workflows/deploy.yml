# Deploy ke GitHub Pages: https://dafaanjc.github.io/time-and-price-academy/
# Berdasarkan panduan resmi Astro (docs.astro.build/en/guides/deploy/github/).
# Syarat sekali saja: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, validate, build, and upload your site
        uses: withastro/action@v6
        with:
          # Deploy hanya bila seluruh validasi lolos: astro check, build,
          # pemeriksaan merek, dan pemeriksaan tautan/metadata berbagi.
          build-cmd: npm run validate

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
